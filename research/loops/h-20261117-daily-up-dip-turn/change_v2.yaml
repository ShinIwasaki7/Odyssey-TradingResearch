reason: "押し目の後の入場は損切りが狭くなりやすく、建玉が大きくなって、固定の費用が損失の予算の大きな割合を占めると考えた。損切りの参照本数を軸に足して広い損切りを試す。試行の数の範囲に収めるため、利確の倍率の軸を外して宣言の値のままにする。"
prediction: "参照本数の長い試行が選ばれることが多くなり、取引あたりの費用の負担が軽くなって、経路の損失とドローダウンが小さくなる。保有は長くなり、日替わりをまたぐ回数が増える。それでも共通基準に届く見込みは低い。短い参照本数ばかりが選ばれるか損失が減らなければ、仮説は支持されない。"
