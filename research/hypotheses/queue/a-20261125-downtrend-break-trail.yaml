schema_version: 1
id: "a-20261125-downtrend-break-trail"
mouth: ai
created_at: "2026-11-25T10:35:38Z"
title: "downtrend-break-trail"
symbol: AUDUSD
rule: "一時間足の短い EMA（期間 50）が長い EMA（期間 100）を下回る局面に限り、一時間足の終値が直近 N 本（60 か 120）の一時間足の安値の最小を下抜けたら成行で売る。損切りは直近 M 本（48 か 96）の一時間足の高値の最大に置き、保有中は一時間足の確定ごとに同じ水準へ損切りを引き下げる。利確は置かず、追従する損切りだけで出る。どちらの水準も評価の時点の最新の足を除いて数える。売りだけ。"
strategy:
  entry_policy: {kind: "IMMEDIATE"}
  opportunity_validity: {bindings: []}
  components:
    - instance_id: "mid_ema"
      component: "ema"
      component_version: 1
      inputs:
        prices:
          - "market:AUDUSD/1h/bid:CLOSE"
      parameters:
        period: {type: "INT", value: 50}
        window_bars: {type: "INT", value: 150}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "slow_ema"
      component: "ema"
      component_version: 1
      inputs:
        prices:
          - "market:AUDUSD/1h/bid:CLOSE"
      parameters:
        period: {type: "INT", value: 100}
        window_bars: {type: "INT", value: 300}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "downtrend"
      component: "price_compare"
      component_version: 1
      inputs:
        left:
          - "output:mid_ema.value"
        right:
          - "output:slow_ema.value"
      parameters:
        operator: {type: "STR", value: "LT"}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "no_long"
      component: "constant_condition"
      component_version: 1
      parameters:
        value: {type: "BOOL", value: false}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "market_state"
      component: "permission_from_condition"
      component_version: 1
      inputs:
        long_allowed:
          - "output:no_long.condition"
        short_allowed:
          - "output:downtrend.condition"
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "breakout_level"
      component: "extreme_price"
      component_version: 1
      inputs:
        prices:
          - "market:AUDUSD/1h/bid:LOW"
      parameters:
        lookback: {type: "INT", value: 60}
        mode: {type: "STR", value: "MIN"}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "stop_level"
      component: "extreme_price"
      component_version: 1
      inputs:
        prices:
          - "market:AUDUSD/1h/bid:HIGH"
      parameters:
        lookback: {type: "INT", value: 48}
        mode: {type: "STR", value: "MAX"}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "entry_trigger"
      component: "breakout_trigger"
      component_version: 1
      inputs:
        price:
          - "market:AUDUSD/1h/bid:CLOSE"
        level:
          - "output:breakout_level.level"
      parameters:
        direction: {type: "STR", value: "SHORT"}
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
    - instance_id: "entry_order"
      component: "market_order_intent"
      component_version: 1
      inputs:
        opportunity:
          - "output:entry_trigger.opportunity"
      triggers:
        - {name: "opp", when: "input_event", input_name: "opportunity"}
    - instance_id: "initial_stop"
      component: "level_stop_loss"
      component_version: 1
      inputs:
        opportunity:
          - "output:entry_trigger.opportunity"
        level:
          - "output:stop_level.level"
      triggers:
        - {name: "opp", when: "input_event", input_name: "opportunity"}
    - instance_id: "trailing"
      component: "trailing_stop"
      component_version: 1
      inputs:
        position:
          - "runtime:POSITION"
        level:
          - "output:stop_level.level"
      triggers:
        - {name: "h1", when: "bar_close", series: "AUDUSD/1h/bid"}
  roles:
    market_state: "market_state.permission"
    trigger: "entry_trigger.opportunity"
    order: "entry_order.intent"
    protection: "initial_stop.protection"
    exit: "trailing.action"
  opportunity_concurrency:
    max_active: 1
    on_new_trigger: "KEEP_EXISTING"
    on_order_accepted: "KEEP_OTHERS"
grid:
  axes:
    - {instance: "breakout_level", parameter: "lookback", values: [60, 120]}
    - {instance: "stop_level", parameter: "lookback", values: [48, 96]}
prediction: "下降の局面で取引が多く利益が伸び、上昇の局面では取引がほとんど起きない。横ばいの局面では小さな負けが続き、勝率は低い。"
inspiration: "過去の実験の分析メモと既存の宣言がどれも買いだけで、倍率の利確が多いことと、部品のカタログから。下げの流れの続きを売りで追い、追従する損切りで伸ばす形は既存の宣言に無い。"
evidence_estimate: {frequency_band: MEDIUM, reaches_floor: LIKELY}
