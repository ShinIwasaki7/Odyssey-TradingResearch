# 期間別の時刻の規則の表 版 1（OANDA MT5 API の 1 分足。8 通貨 × 2017-01-01〜2023-12-31）
#
# 正本の内容: D12 §11.7.10 の「期間別の時刻の規則の表 版 1」（9 行）。人間の承認: 第 14 回（D12-48。
# 探索研究の前提として承認）、第 17 回（D12-70。判定条件 版 2 で再承認）。本ファイルは表を 1 ファイルに
# した版付きの記録（D12-47 (a)）で、行・区分・標準仮説・候補・根拠は D12 §11.7.10 と同じ。食い違えば
# D12 §11.7.10 と人間の決定の原文（D12 §0.1.16〜§0.1.24）が正本。
#
# このファイルのバイト列の SHA-256 を、承認済みの表の一覧（approved_time_rule_tables.yaml）・D12 §0.1.26・
# データ配置の決定記録（ADR-0013）に書く。1 バイトでも変えたら別の版（版 2）として新しいファイルを作り、
# 人間の承認とハッシュの記録をやり直す（D12-48。前の版での結果は採用の根拠にしない）。
#
# 読み方（D03 §15.9）:
# - 変換 offset_hours は「API の時刻 − UTC」の時間数。UTC = API の時刻 − offset_hours。
# - 期間 periods は暦日の半開区間 [from, to)。境目はすべて夏時間の切替の日曜（00:00）で、週末の休場の中にある。
# - 表を引く鍵は API の生の時刻の暦日（変換の前）。取引時間の中の分では、UTC の暦日で引いても同じ行になる
#   （切替の日曜の 00:00 の前後 3 時間はどちらの時刻でも週末の休場の中にあるため。D03 §15.9 の検査 T4）。
# - to の 2024-01-01 は研究期間の終わりを表す排他の境界で、2024 年以降のデータを指さない。
# - 本ファイルの読込・検証は app.config が行う（ADR-0018。人間が承認する宣言なので YAML）。

