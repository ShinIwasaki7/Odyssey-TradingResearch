# 2024 年以降の時刻の規則の表 版 1（OANDA MT5 API の 1 分足。8 通貨 × 2024-01-01〜2027-12-31。封印の取り込みの受入れ用）
#
# 正本の内容: D03 §16.2.3 の「行の案」（4 行。PR #109 の要決定 S2b-1 (a)「別の新しい表」・S2b-2 (a)「米国式 +3」、
# 仮置き S2b-2「判定条件 版 2、すべて仮定付き」・S2b-3「覆う期間 [2024-01-01, 2028-01-01)」）。研究期間の表 版 1
# （time_rule_table_v1.yaml、識別 oanda_mt5_time_rules）は 1 バイトも変えない（D12-48）。研究期間の snapshot は版 1、
# 封印の snapshot はこの表を参照し、1 つの snapshot に 2 つの表は入らない。
#
# 人間の承認: 順 6 の封印レーンの S4a の PR の「承認の対象」（表とカレンダーを 1 回の質問・2 項目で問う。D03 §16.2.6、
# PR #109 の仮置き S2b-5）。承認は PR の merge で確定する。
#
# このファイルのバイト列の SHA-256 を、承認済みの表の一覧（approved_time_rule_tables.yaml）とデータ配置の決定記録
# （ADR-0013）に書く。1 バイトでも変えたら別の版（版 2）として新しいファイルを作り、人間の承認とハッシュの記録を
# やり直す（D12-48）。毎年 9 月末までに次の年の行を足した新しい版を作る（PR #109 の仮置き S2b-3）。
#
# 読み方（D03 §15.9。研究期間の表と同じ）:
# - 変換 offset_hours は「API の時刻 − UTC」の時間数。UTC = API の時刻 − offset_hours。
# - 期間 periods は API の時刻の暦日の半開区間 [from, to)。両端（2024-01-01・2028-01-01）を除く境目は夏時間の切替の
#   日曜（00:00）で、週末の休場の中にある。夏時間の切替の日付は公開の暦（米国: 3 月の第 2 日曜・11 月の第 1 日曜、
#   欧州: 3 月の最後の日曜・10 月の最後の日曜）を Python の zoneinfo（IANA）で計算して確かめた（D03 §16.2.1）。
#   将来の年の日付は今の法律の規則による。
# - 2024 年以降の行はすべて「仮定付き」（2024 年以降のデータを閲覧しない・比較材料が無い。判定条件 版 2 の C8 (i)。
#   D03 §16.2.2）。観察した範囲は空のまま増えない（封印のデータを見て表を直す経路は作らない。D03 §16.2.3）。
# - 本ファイルの読込・検証は app.config が行う（ADR-0018）。価格・2024 年以降のデータは使っていない。

