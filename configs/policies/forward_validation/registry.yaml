# 前向き検証の規則の版の登録簿（D09 §9.11.12 の 1。仮置き F1-2。採用審査の規則の登録簿
# configs/policies/adoption_review/registry.yaml と同じ形）
#
# 読込（app.config.forward_validation）は、読む版の要素をこの登録簿から探し、その版の規則のファイル
# （forward_validation_v<版>.yaml）から計算したダイジェストを `digest` と照合する（無い・違えば止まる）。
# 読込がこのファイルへ書き足すことはしない。
#
# - `digest`: 規則のファイルの解決済みの値の正規化ダイジェスト（sha256 の 16 進 64 文字）。
# - `effective_after`: 版 1 は `null`（最初から効く）。版 2 以上は、その登録の後に固定した候補にだけ
#   当たる（仮置き F1-14）。版 2 以上の効き始めの印の中身は版 2 を足す PR で決める（それまで版 2 以上の
#   要素は読込で止まる。F2 の仮置き）。
#
# **登録は人間が版を足すときに、規則のファイルと同じコミットで 1 行足す**。要素は書き換えも削除もしない
# （固定の記録がダイジェストで指す版を後から変えないため。K-43）。
# 版 1 は順 6 の F2 の PR で、研究候補が 0 件のうちに足した（値は 2026-11-10 の決定 71〜77 と仮置き
# F1-1〜F1-19 の「このまま」。`digest` は読込が計算した値）。

