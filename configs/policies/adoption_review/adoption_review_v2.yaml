# 採用審査の規則 版 2（D16 v0.4 案 §7.2 の行 5 の版 2・§10.3。D06 v1.20 案 §19.13。順 7 の換算の実装
# PR C2 で、登録簿の 1 行と同じコミットで足した）
#
# 版 1（adoption_review_v1.yaml）との違いは行 5（換算）の `currency_conversion` だけ。他の行・値は版 1
# と同じ（2026-10-30 の人間の決定。D16 §0.5 の原文）。行 5 の版 2 は人間の決定 D17-14 (a)「採用審査の
# 換算の行の版 2 を換算の作業に含める」（D17 §0.5.1）による。**版を上げずに中身を変えない**（登録簿の
# ダイジェストと照合され、中身を変えると審査の入口で `ENTRY_RULES_VERSION_CHANGED` になる）。
#
# 版 2 は、登録簿の `effective_after`（登録の時点の試行台帳の末尾の行）より後に開始した実行にだけ
# 当たる。それより前に開始した実行には版 1 が当たる（R1-10 (a)）。
#
# 証拠の最低線の件数は研究ポリシーの現行の版から審査のたびに読むので、ここには書かない（仮置き 4）。
# 本ファイルの読込・検証は app.config（Pydantic）が行う（ADR-0018）。

schema_version: 1
id: adoption_review
version: 2

cost_model_fit:
  # 行 2-1: スプレッドの広がる時間帯への約定の集中（R1-6 (a)）。版 1 と同じ。
  spread_session_concentration:
    window: {anchor: WEEKLY_OPEN, length: "PT2H"}
    max_ratio: "2"
  # 行 2-2: 利幅に対する固定の費用（スプレッドと滑り）の割合（R1-7 (a)）。版 1 と同じ。
  fixed_cost_share: {max_share: "0.25"}
  # 行 3: スワップ未計上（R1-5 (a)）。版 1 と同じ。
  swap_rollover: {rule: ANY_CROSSING}
  # 行 5 の版 2: 決済通貨が口座の通貨と同じなら「適合」（版 1 と同じ）。違っても、決済通貨が
  # 「換算の能力が実装された決済通貨の一覧」にあれば「適合」、無ければ「能力の追加が要る」
  # （CURRENCY_CONVERSION）。一覧は順 7 の 8 通貨のうち円以外の決済通貨（D06 §19.13 の仮置き C1-13）。
  # 換算は研究の run と最終検証の run のどちらでも実装される（D06 §19.14）。
  currency_conversion: {convertible_settlement_currencies: ["CHF", "USD"]}
  # 行 1・4・6: 宣言の読込がそれ以外の形を受け付けないので、常に「適合」（仮置き 9）。
  declared_fits: [BAR_RESOLUTION, SINGLE_POSITION_MARKET_ENTRY, NON_LEARNING]

deflated_sharpe:
  # 割り引く値は最後の fold の選定区間の、選ばれた試行の値（R1-3 (a)）。版 1 と同じ。
  basis: LAST_FOLD_SELECTION
  # 「仮定に合わない」の印の条件（仮置き 5）。版 1 と同じ。
  assumption_flags: {min_trades: 30, max_flat_day_share: "0.5"}

# 判定できないときの結果（R1-4 (a)）。版 1 と同じ。
undetermined_result: DEFERRED
