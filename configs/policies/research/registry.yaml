# 研究ポリシーの版の登録簿（D09 §10.9、D07 §20.2 v2.7・v2.9、2026-09-29 の人間の決定 Q8・2026-09-30 の Q33）
#
# 書式 v2 の実験設定を読むとき、研究ポリシーファイルを読んだ直後にこの登録簿と照合する:
# 版参照 (id, version) の要素が無ければ拒否（未登録の版は使えない）、`digest` がファイルから計算
# した値と違えば拒否、評価基準の群を持つ版（版 3 以上）で `purpose` がファイルの
# `evaluation_standard.purpose` と違えば拒否する。読込がこのファイルへ書き足すことはしない。
#
# - `digest`: 研究ポリシーファイルのすべての値の項目の正規化ダイジェスト（sha256 の 16 進 64 文字）。
# - `purpose`: 評価基準の群を持つ版（版 3 以上）だけが書く（STANDARD / MECHANISM_CHECK）。
#   版 1・2 の要素には書かない。
#
# **登録は人間が版を足すときに、研究ポリシーのファイルと同じコミットで1行足す**。要素は書き換え
# も削除もしない（過去の実験の記録票が指す版を後から変えないため）。版 3（評価基準の値）は
# D09 §17.3 の Q19〜Q32 が決まってから足す。

