# 研究ポリシー v5（研究ポリシー第 5 版。損失の側の判定・試行数で割り引いた指標・局面の表示。D24 §2・§7.1）
#
# 順 11 の第 5 版の設計 D24（v0.2。PR #177・#179 で merge 済み）の値を書いた版である。中身は人間の
# 決定 130〜142・155（D23、ADR-0044）と決定 158〜167（D24 §0.5）で決まっている。第 4 版の判定・選定・
# 証拠の要件・fold・評価範囲・前提の記録・比較の前提はすべてそのまま写し（D23 の仮置き 10）、損失の
# 側の条件と局面の値だけを足した（D24 §2.2）。値は戦略の成績を読まずに、方針の値（1 取引の損失の予算
# 2%・最大ドローダウン 30%・証拠の最低 8 件・証拠の水準 95%）と成績を使わない計算だけから出した
# （D24 §7）。
#
# 第 4 版から足した値（D24 §7.1 の表）:
# - fold の純損失の床: 各 fold の独立口座の run（検証の区間）の、区間末の評価を含む純収益率
#   （`NET_RETURN_RATE_CLOSED_OUT`。指標集合 v4 の #21）≥ −0.15（決定 133。ドローダウンの床 0.30 の半分）。
#   端数の fold にも同じ値を当てる（D13-7 (a)）。
# - 経路の `PROFIT_FACTOR` ≥ 1.2（決定 137）。経路の完了取引と区間の終わりの仮決済の損益から乗算の形
#   「勝ちの合計 ≥ 1.2 × 負けの合計の絶対値」で当て、負けの取引が無い経路は満たすとみなす（決定 166）。
#   **1.2 は方針の仮定の値で、導出したものではない**（決定 159（D24-2 (a)）。未計上の費用への余白。
#   D24 §7.4）。
# - 損失の集中: 最悪の fold の損失 ≤ 1.0 × 経路の純収益率（決定 136）。経路の純収益率が 0.10 以上の
#   ときだけ当てる（決定 155・160（D24-3 (a)）。0.10 は一意に導けない仮定。D24 §7.3）。
# - 近傍の床: 各 fold で選んだ試行の近傍（格子の 1 つの軸だけが書いた順で 1 段隣）の、その fold の選定
#   の区間の独立口座の run で、最大ドローダウン率 ≤ 0.30 かつ区間末の評価を含む純収益率 ≥ −0.30
#   （決定 139・158（D24-1 (a)）。−0.30 は fold の床を区間の長さに比例させた導出値。D24 §7.2）。
# - 試行数で割り引いた確率: 経路の日次の収益率の下側偏差の比率（目標値 0。決定 161）を、割り引いた
#   シャープ比の形（決定 163）で、その実験の試行数と試行どうしの平均のピアソン相関（決定 162）で割り
#   引き、確率 ≥ 0.95（決定 140）。台帳の累計は使わない（決定 Q17）。
# - 局面（`regimes`）: 日足の EMA 50 本の 20 本の変化を ATR 20 本で割った向き（不感帯 0.5）と、ATR ÷
#   終値を直前 250 個の中央値と比べた値動きの大きさの 6 局面（決定 131・132）。**表示・分析用だけで、
#   判定・選定に使わない**（決定 130・134・135。`role: DISPLAY_ONLY`）。入場の時点に公開済みの最後の
#   日足で付ける（D24 §5.1）。
#
# 正式な合否条件は `fold_floors`・`path.floors`・`path.aggregate`・`loss_concentration`・
# `neighbor_floors`・`deflated_downside_ratio` と `sufficiency` だけ。`regimes` は条件ではない。
# この版を指す探索の実験は指標集合 v4 を使う（D24 §8.1 の検査 E11）。
#
# - 登録（決定 142）: 版のファイルとこのダイジェストの登録簿の 1 行を同じコミットで足し、人間が
#   その PR を merge した時点で登録になる（D24 §8.2、仮置き 20）。登録の後は第 5 版が現行の版になり、
#   第 4 版は旧版になる。第 4 版を指す実行（順 10 を含む）は審査の入口で `ENTRY_POLICY_NOT_CURRENT`
#   になる（ADR-0044 第3項）。過去の実行は第 4 版（または第 3 版）の判定のまま残す（D09 §10.11）。
# - 運用の規則（D24 §8.3、仮置き 20。コードでは止めない）: この版の登録より後に作る探索の実験は、
#   8 通貨のどれでもこの版を指す。
#
# **版を上げずに中身を変えない**。この版のダイジェストは `registry.yaml` に登録してあり、中身を
# 変えると読込で拒否される（Q8 決定）。

