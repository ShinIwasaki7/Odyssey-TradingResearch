# 研究ポリシー v4（研究ポリシー第 4 版。D18 §2〜§3、D09 §10.9・§17.8、D13 §6.1）
#
# 順 7 の第 4 版レーン（D17 §2.6）の設計 D18（v0.3、PR #146 で merge 済み）の決定 34〜36 と
# 仮置き 1〜11（人間の決定「11 件このまま」。原文は D18 §0.5）の値を書いた版である。第 3 版の評価
# 基準（判定の規則・閾値・証拠の要件）は変えず、対象系列・評価範囲・前提の記録（basis）・比較の
# 前提（comparison basis）を 8 通貨（USDJPY・EURJPY・GBPJPY・AUDJPY・EURUSD・GBPUSD・AUDUSD・
# USDCHF）へ広げた。値は戦略の成績を読まずに D09 §17.8 の段 1〜5 の規則から出した（D18 §2）。
#
# - 評価範囲は 8 通貨 × 2 組の 16 個の承認済み snapshot に段 3 の規則を当てた共通の区間
#   2017-03-25T12:00Z〜2023-12-30T12:00Z（2,471 日。決定 34（D18-1 (a)）。第 3 版と同じ値）。
# - 選定区間・検証区間・分割・選定・条件・証拠の要件・試行数の上限・複雑さの上限は第 3 版の値を
#   そのまま写した（D18 §2.4・§2.5、仮置き 2）。fold は第 3 版と同じ 5 つ。
#   **方針上の最低件数は「この件数より少ない結果は研究候補として扱わない」という研究の方針の
#   条件であり、統計的な十分性の保証ではない**（D13 §5.2）。
# - 対象系列は 8 通貨 × {15 分足, 1 時間足} の 16 系列（D18 §2.1、仮置き 3）。
# - 前提の記録は通貨ごとの snapshot の組（8 組）と、換算の snapshot の組（USDJPY の 2 組。D17-3a (a)、
#   仮置き 4）、前提の規則のファイル 16 個（第 3 版の 7 個・研究期間の確認済みハッシュの一覧・8 通貨の
#   銘柄の設定。仮置き 5）。SHA-256 は読込が実ファイルと照合する（D18 §3.4）。
# - 比較の前提は 8 通貨で共通の項目（円の口座・初期残高 1,000,000 円・1 取引の損失予算 2%・口座全体
#   の上限 20%・1 単位の手数料 0.001 円・入場の遅延 0 本・換算の決め事 米ドル経由・上限 30 分）と、
#   通貨ごとの 4 つの値（USDJPY の値を pip の数で写した値。決定 35（D18-2 (a)）・決定 36（D18-3 (a)）、
#   仮置き 6）。通貨ごとの値は読込が銘柄の設定から写した値と照合する（D06 §19.11、D18 §3.4）。
# - 用途 STANDARD のこの版を指す探索の実験は、執行系列の通貨で通貨ごとの値を引き、照合 C1〜C7
#   （D18 §3.3）を読込で当てる。
# - 運用の規則（決定 38（D18-5 (a)）。コードでは止めない）: この版の登録より後に作る探索の実験は、
#   8 通貨のどれでも（USDJPY も）この版を指す。第 3 版は登録簿に残り、第 3 版を指す既存の実験と
#   記録票はそのまま照合・再現できる（D18 §3.5、D09 §10.9）。
#
# 正式な合否条件は `fold_floors`・`path.floors`・`path.aggregate` と `sufficiency` だけ（第 3 版と同じ）。
#
# **版を上げずに中身を変えない**。この版のダイジェストは `registry.yaml` に登録してあり、中身を
# 変えると読込で拒否される（Q8 決定）。

