# 取引カレンダー fx_ny17 v2（D03 §3.4・§3.4.1・§9）
#
# 版 1 からの変更は**休場の宣言（closures）だけ**である。週の開閉・時間帯・営業例外は変えない。
# 段階4 の実データ分類（第 1 弾。2026-09-24〜25 の人間の決定）で、受入れの検査が報告した
# 「存在すべき足の欠落」のうち休場と分類したものを宣言した。
#
# - 元日（元日が平日でデータが含む 2018〜2021・2024〜2026 年）と 2017 年のクリスマス:
#   取引日単位の休場（covers_trading_day。前日 17:00〜当日 17:00）。全 20 系列でこの形で欠落していた。
# - クリスマスの部分日（2018〜2020・2023〜2025 年）: 短縮セッション（start〜end を閉じる）。
#   閉じる時刻は年ごとに、15分足・1時間足の全 20 系列に共通する欠落区間から読み取った
#   （2019 年だけ 04:00 から。1 系列に 03:00 台の足があるため）。共通区間より前に一部の系列だけで
#   欠けている足は、休場ではなくデータ欠損として分類した。
#
# 分類の記録は configs/calendars/classification_fx_ny17_v2.yaml（分類ファイル）と、確定した
# snapshot の manifest（closure_decisions・resolved_classifications）にある。
#
# 週の開閉はニューヨーク現地の日曜 17:00 から金曜 17:00。土日は UTC の曜日判定ではなく、
# この週の開閉から導かれる（D03 §3.4、上位設計書 §4.3.10）。休場は宣言制で、推測で祝日を
# 先に書き込まない（版 1 の注記と同じ理由）。
#
# weekday は 0=月曜 … 6=日曜（Python の date.weekday() と同じ）。
#
# 本ファイルの読込・検証は app.config（Pydantic）が行う（ADR-0018）。

schema_version: 1

id: fx_ny17
version: 2
tz: America/New_York

weekly_open:
  weekday: 6 # 日曜
  at: "17:00:00"

weekly_close:
  weekday: 4 # 金曜
  at: "17:00:00"

# 宣言した休場・短縮（段階4 の分類 第 1 弾で追加）。
# 記入形式（3つのうちどれか1つ。D03 §3.4.1）:
#   - local_date: "2025-01-01"
#     covers_trading_day: true
#     note: "取引日単位の休場（前日 17:00〜当日 17:00。週の開閉時刻が取引日の境界）"
#   - local_date: "2024-12-25"
#     covers_whole_day: true
#     note: "終日休場（現地 0:00〜翌日 0:00）"
#   - local_date: "2024-12-24"
#     start: "13:00:00"
#     end: "17:00:00"
#     note: "短縮セッション"
closures:
  - local_date: "2017-12-25"
    covers_trading_day: true
    note: クリスマスの休場（取引日単位。前日 17:00〜当日 17:00）
  - local_date: "2018-01-01"
    covers_trading_day: true
    note: 元日の休場（取引日単位。前日 17:00〜当日 17:00）
  - local_date: "2018-12-25"
    start: "03:00:00"
    end: "17:00:00"
    note: クリスマスの短縮セッション（03:00〜17:00 を休場。15分足・1時間足の全20系列に共通する欠落区間から読み取り）
  - local_date: "2019-01-01"
    covers_trading_day: true
    note: 元日の休場（取引日単位。前日 17:00〜当日 17:00）
  - local_date: "2019-12-25"
