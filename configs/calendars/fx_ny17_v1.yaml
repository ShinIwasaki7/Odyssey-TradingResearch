# 取引カレンダー fx_ny17 v1（D03 §3.4・§9）
#
# 週の開閉はニューヨーク現地の日曜 17:00 から金曜 17:00。土日は UTC の曜日判定ではなく、
# この週の開閉から導かれる（D03 §3.4、上位設計書 §4.3.10）。
#
# **休場は宣言制**。受入れの検査で「足が存在すべきなのに無い区間」が見つかったら、人間が
# 「休場（このファイルへ追加して version を上げる）」か「データ欠損（そのまま欠損として
# 扱う）」に分類し、結果を snapshot manifest に残す（D03 §3.4・§4 の 9）。
#
# closures は初版では空にしてある。実データの受入れを1回実行し、検出された欠落区間を人間が
# 分類した結果として追加していく。推測で祝日を先に書き込むと、実際の欠落が「宣言済みの休場」
# に吸収されて検査が沈黙するため、分類前の推測は入れない。
#
# weekday は 0=月曜 … 6=日曜（Python の date.weekday() と同じ）。
#
# 本ファイルの読込・検証は app.config（Pydantic）が行う（ADR-0018）。

schema_version: 1

id: fx_ny17
version: 1
tz: America/New_York

weekly_open:
  weekday: 6 # 日曜
  at: "17:00:00"

weekly_close:
  weekday: 4 # 金曜
  at: "17:00:00"

# 宣言した休場・短縮。分類が確定するまで空。
# 記入形式（3つのうちどれか1つ。D03 §3.4.1）:
#   - local_date: "2025-01-01"
#     covers_trading_day: true
#     note: "取引日単位の休場（前日 17:00〜当日 17:00。週の開閉時刻が取引日の境界）"
#   - local_date: "2024-12-25"
#     covers_whole_day: true
#     note: "終日休場（現地 0:00〜翌日 0:00）"
#   - local_date: "2024-12-24"
#     start: "13:00:00"
#     end: "17:00:00"
#     note: "短縮セッション"
closures: []

# 宣言した営業例外（D03 §3.4 v1.7）。週の休場時間帯のうち市場が開いていた区間。
# 受入れの「休場帯の足」を人間が営業例外と分類したときに追加して version を上げる。
# 通常の週の開場区間に接するか重なるものだけを許し、休場と重なるものは拒否される。
# 記入形式:
#   - local_date: "2020-03-15"
#     start: "16:00:00"
#     end: "17:00:00"
#     note: "早期開場"
openings: []
