#
# 対象: 実データ 20 ファイル（10 銘柄 × 15分足・1時間足）と自動生成の 4時間足・日足を、カレンダー
# fx_ny17 v1 で受け入れた暫定 snapshot の分類対象の警告 23,985 区間（存在すべき足の欠落 22,715、
# 休場帯の足 1,270）。確定段階の再実行（カレンダー v2）で新たに現れた警告 35 区間（休場で
# 切り詰められた上位足が、なお構成足の欠落で作れないもの）も含めて分類している。
#
# 分類は 2026-09-24〜25 の人間の決定 1〜5 に従う（下の各節）。決定 1・2 の休場はカレンダー新版
# （calendar）に宣言してあり、ここには「どの警告を休場と分類したか」だけを書く（D03 §10）。
#
# 本ファイルは受入れ・分類の検査報告から機械的に組み立てた。区間の境界は検査報告の警告の区間と
# 休場の区間（UTC）である。
#
