# 検証戦略 A の実データでの実験設定・2018 年（書式 v2。D07 §18・§23）
#
# 実データでの実行（D07 §23、2026-09-25 の人間の決定6）の2本目。研究履歴 2016〜2023 の1本
# （`strategy_a_usdjpy_research_history.yaml`）は、執行系列 USDJPY 15分足のデータ欠損で実行前の
# データ能力検査に止められる（D06 §10.5 の手順2）。そこで**執行系列の欠落が1件も無い 2018 年**で
# 完走する1本を足す（Q9 決定）。実行の記録は `docs/runs/stage4_realdata_run.md`。
#
# 研究履歴の1本との違いは `id` と `run_interval` だけである（仮説も同じ。段階4 は採否を決めない）。
#
# - **run 区間は 2018 年の取引週**: 2017-12-31（日）17:00 NY〜2018-12-28（金）17:00 NY（冬時間なので
#   22:00Z）。取引カレンダー `fx_ny17` v2 は元日を取引日単位の休場として持つ。
# - **取引カレンダーは `fx_ny17` v2**（snapshot を受け入れたときと同じ版。D03 §3.7）。
# - **`snapshot` は承認済み snapshot の識別子**（2026-09-25 承認。PR #39）。
#
# **パスはリポジトリの根からの相対パス**で書く（D07 §18.2）。**数値は文字列で書く**（ADR-0012）。

schema_version: 2

id: strategy_a_usdjpy_2018
version: 1

hypothesis: "検証戦略 A の規則が研究履歴で、費用込みでどの程度の損益になるかを記録する（採否の判断はしない）"

research_policy: {id: "research_policy", version: 1}

strategy: "configs/strategies/strategy_a_v1.yaml"

environment:
  calendar: "configs/calendars/fx_ny17_v2.yaml"
  timeframes: "configs/calendars/timeframes_v1.yaml"
  symbols: "configs/symbols"

snapshot: "a498b8cf4f90aeca1fa8af7a1e59112db197413eaa8c0a0d318eb2368a770cb3"

run_interval:
  start: "2017-12-31T22:00:00Z"
  end: "2018-12-28T22:00:00Z"

execution_series: "USDJPY/15m/bid"

resolution_hierarchy:
  - "USDJPY/15m/bid"

seed: 0

account:
  account_id: "ACC1"
  currency: "JPY"
  initial_balance: "1000000"

risk_policy:
  trial_risk_rate: "0.02"
  account_risk_cap: "0.20"

execution_policy:
  entry_delay_bars: 0
  entry_valid_for: "PT20M"
  close_valid_for: "PT20M"
  adverse_fill_limits:
    USDJPY: "0.05"
  reference_quote_source: "EXECUTION_SERIES_LAST_CLOSE"

cost_model:
  commission_per_unit: "0.001"
  entry_slippage: "0.01"
  close_slippage: "0.01"
  spread_offset: "0.02"

conversion_policy:
  pivot_currency: "USD"
  max_observation_skew: "PT15M"

evaluation: {metric_set_version: 2}

search_plan: "NONE"
split: "NONE"
