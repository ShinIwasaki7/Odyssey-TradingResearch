# 順 5 の改善後の実験（版 2）: 研究仮説 H2「日足の上昇局面での、1 時間足の移動平均の上抜け」の
# 探索の実験設定（書式 v2。D14 §2.5 の手順 4「変更の記録」の成果物 (2)・(3)、D09 §5.6）
#
# 版 1（`configs/experiments/h2_daily_uptrend_h1_ema_cross.yaml`）を複製し、D09 §5.6 の「次の実験の
# 始め方」のとおり `version` と `search_plan` だけを書き換え、系譜（`lineage`）を足したもの。
# 版 1 のファイルは変えない（版 1 の記録票の事前登録の照合と再現が読む。PR-2 の仮置き 2）。
#
# 人間の決定（2026-10-27。原文は `docs/data/usdjpy_step5_research_loop/README.md` §3.1）: 変更の種類は
# `PARAMETERS` の 1 種類（D14-5 (a)）で、1 時間足の EMA の期間 P の軸の範囲を上側へ動かす（1 回目）。
# 新しい P の値の組は {50, 75}（2 回目。PR-2 の要決定への回答）。
#
# - 変えたもの: `version`（1 → 2。同じ実験名の次の版。D14 仮置き 8）、`search_plan` の P の軸の値
#   （{20, 50} → {50, 75}）、`lineage`（系譜。D13 §7.1、D14 §2.5 の (3)）。
# - 変えないもの: 仮説の文・研究ポリシー（第 3 版）・戦略宣言（`h2_daily_uptrend_h1_ema_cross_v1.yaml`。
#   STRATEGY_CODE の変更ではないため）・両組の snapshot・環境・口座・リスク・執行・費用・換算・
#   指標集合・利確の倍率 R の軸 {1.5, 3.0}・`max_trials`（4）・`split`・`final_holdout`。
# - 1 時間足の EMA の窓 `window_bars` は戦略宣言の 150 のまま（D14 仮置き 15）。新しい格子の最大の
#   P（75）でも部品の条件 `window_bars >= 2 * period` を満たす。
# - 試行番号は D09 §5.2 の列挙の順（`h1_ema.period` が遅く、`take_profit.reward_risk` が速く変わる）:
#   0 = (50, 1.5)、1 = (50, 3.0)、2 = (75, 1.5)、3 = (75, 3.0)。
# - 系譜の理由の文（`lineage.note`）には成績の数値と判定の値を書かない。理由の根拠は分析メモ
#   （版管理の外）にあり、ここには置き場と SHA-256 を書く（D14 仮置き 7）。台帳の開始の行には
#   理由の文のダイジェストだけが入る。`derived_from` の実行が台帳にあることは `experiment run` の
#   開始時に確かめられる（実装 PR #98 の仮置き 56・65）。
#
# **パスはリポジトリの根からの相対パス**で書く（D07 §18.2）。**金額・率は文字列で書く**（ADR-0012）。

