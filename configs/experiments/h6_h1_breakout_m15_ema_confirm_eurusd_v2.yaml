# 順 8 の改善後の実験（版 2）: 研究仮説 H6「1 時間足の高値更新を、15 分足の移動平均で確かめてから入る」
# の EURUSD の探索の実験設定（書式 v2。D19 §2.1 の手順 4「変更の記録」、D14 §2.5 の (2)・(3)、D09 §5.6）
#
# 版 1（`configs/experiments/h6_h1_breakout_m15_ema_confirm_eurusd.yaml`）を複製し、D09 §5.6 の「次の実験の
# 始め方」のとおり `version` と `search_plan` だけを書き換え、系譜（`lineage`）を足したもの。
# 版 1 のファイルは変えない（版 1 の記録票の事前登録の照合と再現が読む）。
#
# 人間の決定 66（2026-11-09。原文は `docs/data/eurusd_step8_research_loop/README.md` §3.1）: 変更の種類は
# 格子の値の変更（`PARAMETERS`）の 1 種類（D14-5 (a) を決定 48〜57 で引き継いだ）で、利確の倍率 R の軸を
# 下へ動かし、保有を短くする。新しい R の値の組は {1.0, 1.5}（決定 67。同 README §3.1）。
#
# - 変えたもの: `version`（1 → 2。同じ実験名の次の版。D14 仮置き 8 に倣う）、`search_plan` の R の軸の値
#   （{1.5, 3.0} → {1.0, 1.5}）、`lineage`（系譜。D13 §7.1、D14 §2.5 の (3)）。
# - 変えないもの: 仮説の文・研究ポリシー（第 4 版）・戦略宣言（`h6_h1_breakout_m15_ema_confirm_eurusd_v1.yaml`。
#   STRATEGY_CODE の変更ではないため。部品・部品の版・損切り・軸でない値も同じ）・両組の snapshot と
#   換算の snapshot の組・環境・口座・リスク・執行・費用・換算・指標集合・1 時間足の高値の窓 N の軸
#   {10, 20}・`max_trials`（4）・`split`・`final_holdout`。
# - 試行番号は D09 §5.2 の列挙の順（`breakout_level.lookback` が遅く、`take_profit.reward_risk` が速く
#   変わる）: 0 = (10, 1.0)、1 = (10, 1.5)、2 = (20, 1.0)、3 = (20, 1.5)。R 1.5 の 2 試行（版 2 の
#   試行 1・3）は、版 1 の試行 0・2 と同じ設定である。
# - 系譜の理由の文（`lineage.note`）には成績の数値と判定の値を書かない。理由の根拠は分析メモ
#   （版管理の外）にあり、ここには置き場と SHA-256 を書く（D14 仮置き 7 に倣う）。台帳の開始の行には
#   理由の文のダイジェストだけが入る。`derived_from` の実行が台帳にあることは `experiment run` の
#   開始時に確かめられる（実装 PR #98 の仮置き 56・65）。
#
# **パスはリポジトリの根からの相対パス**で書く（D07 §18.2）。**金額・率は文字列で書く**（ADR-0012）。

