# 順 10 の改善後の実験（版 2）: 研究仮説 H7「1 時間足の 2 本の移動平均の交差（短い EMA が長い EMA を上抜け）」
# の EURUSD の探索の実験設定（書式 v2。D22 §2.1 の手順 4「変更の記録」、D14 §2.5 の (2)・(3)、D09 §5.6）
#
# 版 1（`configs/experiments/h7_h1_dual_ema_cross_eurusd.yaml`）を複製し、D09 §5.6 の「次の実験の
# 始め方」のとおり `version` と `strategy`（戦略宣言の参照）だけを書き換え、系譜（`lineage`）を足したもの。
# 版 1 のファイルは変えない（版 1 の記録票の事前登録の照合と再現が読む）。
#
# 人間の決定 127（2026-11-15。原文は `docs/data/eurusd_step10_research_loop/README.md` §3.1）: 変更の種類は
# 既存部品の範囲での戦略の宣言の変更（`STRATEGY_CODE`）の 1 種類（D14-5 (a) を決定 102 で引き継いだ）で、
# 日足の局面を足す。中身は戦略宣言の版 2（`configs/strategies/h7_h1_dual_ema_cross_eurusd_v2.yaml`）。
#
# - 変えたもの: `version`（1 → 2。同じ実験名の次の版。D14 仮置き 8 に倣う）、`strategy`（版 1 → 版 2 の
#   戦略宣言）、`lineage`（系譜。D13 §7.1、D14 §2.5 の (3)）。
# - 変えないもの: 仮説の文・研究ポリシー（第 4 版）・両組の snapshot と換算の snapshot の組・環境・執行系列・
#   解像度の階層・口座・リスク・執行・費用・換算・指標集合・格子（長い EMA の期間 S {50, 100} × 利確の
#   倍率 R {1.5, 3.0}、`max_trials` 4）・`split`・`final_holdout` の宣言（決定 114・115。版 1 と同じ値）。
# - 試行番号は版 1 と同じ（D09 §5.2 の列挙の順）: 0 = (50, 1.5)、1 = (50, 3.0)、2 = (100, 1.5)、
#   3 = (100, 3.0)。どの試行も版 1 の同じ番号の試行と軸の値が同じで、違うのは日足の局面の有無だけ。
# - 仮説の文は版 1 のまま（取引機会の規則は変えない。分析メモ「5. 変えないこと」。変更は戦略の宣言の
#   1 種類で、仮説の変更（`HYPOTHESIS`）ではない。D14 §6.1 の `STRATEGY_CODE` の例「日足の向きの条件を
#   足す」。本 PR の仮置き）。
# - 系譜の理由の文（`lineage.note`）には成績の数値と判定の値を書かない。理由の根拠は分析メモ
#   （版管理の外）にあり、ここには置き場と SHA-256 を書く（D14 仮置き 7 に倣う）。台帳の開始の行には
#   理由の文のダイジェストだけが入る。`derived_from` の実行が台帳にあることは `experiment run` の
#   開始時に確かめられる（実装 PR #98 の仮置き 56・65）。
# - `final_holdout` は版 1 と同じ宣言（D22 §1.4・§7.1.2「元の実験と改善後の実験で同じ」）。**探索の run は
#   この値を読まない**（研究期間の snapshot だけを読む）。宣言は封印データの要求・取得・閲覧・取り込みの
#   どれでもなく、最終検証を始めもしない（順 10 では採用審査・最終検証に進まない。決定 97）。
#
# **パスはリポジトリの根からの相対パス**で書く（D07 §18.2）。**金額・率は文字列で書く**（ADR-0012）。

