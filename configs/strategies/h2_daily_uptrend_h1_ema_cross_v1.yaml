# 研究仮説 H2「日足の上昇局面での、1 時間足の移動平均の上抜け」の戦略宣言（順 5 の元の実験。
# D14 §3.2 の H2 の列、決定 D14-1 (b)。2026-10-22）
#
# 日足の終値が日足の EMA（期間 20）を上回る局面に限り、1 時間足の終値が 1 時間足の EMA（期間 P）
# を下から上に抜けたら成行で買い、直近 20 本の 1 時間足の安値に損切り、R 倍に利確を
# 置く（D14 §3.2 の仮説の文）。買いだけ（D14 仮置き 14）。
#
# 部品の組み合わせ（D14 §3.2 の「部品の組み合わせ」の行。新しい部品は使わない）:
# - 日足の市場状態は検証戦略 B（`strategy_b_v1.yaml`）と同じ 4 段（`ema` v2・`price_compare` v2・
#   `constant_condition`・`permission_from_condition` v2）。日足は 1 時間足から集約する `1d_ny17`。
# - 取引機会は `breakout_trigger` v1（価格 = 1 時間足の終値、水準 = 1 時間足の `ema` v1 の出力）。
#   部品は「終値 > EMA」が不成立から成立へ変わった評価でだけ発火する（`EDGE`。状態は run の
#   始まりで不成立に戻る。D05 §4.3(2)・D04 §10.4）。これで「下から上に抜けた」を表す。
# - 出口は検証戦略 A（`strategy_a_v1.yaml`）と同じ: 即時の入場（`IMMEDIATE`）・`market_order_intent`
#   v1・`level_stop_loss` v1（直近 20 本の 1 時間足の安値）・`fixed_rr_take_profit`。
#
# 探索する軸（実験設定 `configs/experiments/h2_daily_uptrend_h1_ema_cross.yaml` の `search_plan`。
# 値の正本は D14 §4.3）: `h1_ema.period`（P）と `take_profit.reward_risk`（R）。ここに書いた P と R の
# 値は格子の先頭の試行（試行番号 0）の値で、探索ではどの試行でも格子の値に置き換わる（D09 §5.1。
# D14 に定めが無く、事前登録の PR で置いた前提）。`h1_ema.window_bars` は格子の最大の P の 3 倍の 150 に固定する（D14 仮置き 15）。
#
# 研究仮説の台帳の行を検証用の戦略と分けるため、検証戦略 A・B と別の戦略の識別子にする
# （D14 仮置き 3）。`schema_version` は戦略宣言の保存形式の版（D04 §3）。

schema_version: 1

strategy_id: "h2_daily_uptrend_h1_ema_cross"
version: 1

entry_policy: {kind: "IMMEDIATE"}

# 即時の入場では、取引機会の生成と発注要求が同じ判断時点で起きるので、束縛は空と明示する
# （検証戦略 A と同じ。D04 §10.2 の Q5 決定。D14 に定めが無く、事前登録の PR で置いた前提）。
opportunity_validity:
  bindings: []

components:
  - instance_id: "daily_ema"
    component: "ema"
    component_version: 2
    inputs:
      prices:
        - "market:USDJPY/1d_ny17/bid:CLOSE"
    parameters:
      period: {type: "INT", value: 20}
      window_bars: {type: "INT", value: 60}
    triggers:
      - {name: "d1", when: "bar_close", series: "USDJPY/1d_ny17/bid"}

  - instance_id: "daily_above_ema"
    component: "price_compare"
    component_version: 2
    inputs:
      left:
        - "market:USDJPY/1d_ny17/bid:CLOSE"
      right:
        - "output:daily_ema.value"
    parameters:
      operator: {type: "STR", value: "GT"}
    triggers:
      - {name: "d1", when: "bar_close", series: "USDJPY/1d_ny17/bid"}

  - instance_id: "no_short"
    component: "constant_condition"
    component_version: 1
    parameters:
      value: {type: "BOOL", value: false}
    triggers:
      - {name: "d1", when: "bar_close", series: "USDJPY/1d_ny17/bid"}

  - instance_id: "market_state"
    component: "permission_from_condition"
    component_version: 2
    inputs:
      long_allowed:
        - "output:daily_above_ema.condition"
      short_allowed:
        - "output:no_short.condition"
    triggers:
      - {name: "d1", when: "bar_close", series: "USDJPY/1d_ny17/bid"}

  - instance_id: "h1_ema"
    component: "ema"
    component_version: 1
    inputs:
      prices:
        - "market:USDJPY/1h/bid:CLOSE"
    parameters:
      period: {type: "INT", value: 20}
      window_bars: {type: "INT", value: 150}
    triggers:
      - {name: "h1", when: "bar_close", series: "USDJPY/1h/bid"}

  - instance_id: "entry_trigger"
    component: "breakout_trigger"
    component_version: 1
    inputs:
      price:
        - "market:USDJPY/1h/bid:CLOSE"
      level:
        - "output:h1_ema.value"
    parameters:
      direction: {type: "STR", value: "LONG"}
    triggers:
      - {name: "h1", when: "bar_close", series: "USDJPY/1h/bid"}

  - instance_id: "entry_order"
    component: "market_order_intent"
    component_version: 1
    inputs:
      opportunity:
        - "output:entry_trigger.opportunity"
    triggers:
      - {name: "opp", when: "input_event", input_name: "opportunity"}

  - instance_id: "stop_level"
    component: "extreme_price"
    component_version: 1
    inputs:
      prices:
        - "market:USDJPY/1h/bid:LOW"
    parameters:
      lookback: {type: "INT", value: 20}
      mode: {type: "STR", value: "MIN"}
    triggers:
      - {name: "h1", when: "bar_close", series: "USDJPY/1h/bid"}

  - instance_id: "initial_stop"
    component: "level_stop_loss"
    component_version: 1
    inputs:
      opportunity:
        - "output:entry_trigger.opportunity"
      level:
        - "output:stop_level.level"
    triggers:
      - {name: "opp", when: "input_event", input_name: "opportunity"}

  - instance_id: "take_profit"
    component: "fixed_rr_take_profit"
    component_version: 1
    inputs:
      position:
        - "runtime:POSITION"
    parameters:
      reward_risk: {type: "FLOAT", value: 1.5}
    triggers:
      - {name: "filled", when: "runtime_event", event: "POSITION_OPENED"}

# どの出力がどの役割を担うか（D04 §3 の名前付きフィールド）。
roles:
  market_state: "market_state.permission"
  trigger: "entry_trigger.opportunity"
  order: "entry_order.intent"
  protection: "initial_stop.protection"
  exit: "take_profit.action"

# 取引機会を同時にいくつ保持するか（ADR-0032）。
opportunity_concurrency:
  max_active: 1
  on_new_trigger: "KEEP_EXISTING"
  on_order_accepted: "KEEP_OTHERS"
