# 順 10 の改善後の実験（版 2）の戦略宣言: 研究仮説 H7「1 時間足の 2 本の移動平均の交差（短い EMA が長い
# EMA を上抜け）」の EURUSD 版に、日足の局面の条件を足したもの（D22 §2.1 の手順 4「変更の記録」、
# D14 §2.5 の (2)・(3)）
#
# 人間の決定 127（2026-11-15。原文は `docs/data/eurusd_step10_research_loop/README.md` §3.1）: 変更の種類は
# 既存部品の範囲での戦略の宣言の変更（`STRATEGY_CODE`）の 1 種類（D14-5 (a) を決定 102 で引き継いだ）で、
# 日足の局面を足す。具体の値は分析メモ（版管理の外。SHA-256 は決定 127 の 3 行目）の「3. 変更の候補」の
# 1 位の項をそのまま使った（決定 67 の形）。
#
# 版 1（`configs/strategies/h7_h1_dual_ema_cross_eurusd_v1.yaml`）を複製し、次だけを足したもの。版 1 の
# ファイルは変えない（版 1 の記録票の事前登録の照合と再現が読む）。
#
# - 足したもの: 日足の局面の 4 段（H2 の宣言 `configs/strategies/h2_daily_uptrend_h1_ema_cross_v1.yaml` と
#   検証戦略 B の EURUSD の宣言 `configs/strategies/strategy_b_eurusd_v1.yaml` と同じ部品・版・値。系列は
#   EURUSD の `1d_ny17`）:
#   - `daily_ema`: `ema` v2、日足の終値、期間 20・窓 60、日足の確定で評価
#   - `daily_above_ema`: `price_compare` v2、左 = 日足の終値・右 = `daily_ema` の出力、`GT`、日足の確定で評価
#   - `no_short`: `constant_condition` v1、`false`、日足の確定で評価
#   - `market_state`: `permission_from_condition` v2、買いの許可 = `daily_above_ema` の条件・売りの許可 =
#     `no_short` の条件、日足の確定で評価
#   - 役割 `market_state: "market_state.permission"`（局面は取引機会の発火の時点に適用される。D05 §7.6）
# - 変えないもの: `entry_policy`（`IMMEDIATE`）、`opportunity_validity.bindings`（空。H2 と同じ）、取引機会
#   （`fast_ema`・`slow_ema`・`entry_trigger`）、出口（`entry_order`・`stop_level`・`initial_stop`・
#   `take_profit`）、それらの部品の版、軸でない値（短い EMA の期間 20・窓 60、長い EMA の窓 300、損切りの窓
#   1 時間足 20 本）、同時の保持の値。
# - 履歴窓の最大は日足 60 本（`daily_ema` の窓）で、日足 60 本より長い履歴窓は使わない（D22 §2.5）。
#   新しい部品は使わない（どれも既存の宣言にある部品と版）。
# - 軸のパラメータ（`slow_ema.period`・`take_profit.reward_risk`）の値は格子の先頭の試行（試行番号 0）の
#   値で、探索ではどの試行でも格子の値に置き換わる（D09 §5.1。版 1 と同じ）。パラメータは本数・倍率・
#   向き・比較の向き・真偽だけで、価格の単位の値を持たない。
#
# 戦略の識別子は版 1 と同じ `h7_h1_dual_ema_cross_eurusd`、版 2。
#
# `schema_version` は戦略宣言の保存形式の版（D04 §3）。

schema_version: 1

strategy_id: "h7_h1_dual_ema_cross_eurusd"
version: 2

entry_policy: {kind: "IMMEDIATE"}

# 確認待ちが無いので、発注要求まで再検査する条件は無い。局面は役割 `market_state` で取引機会の発火の
# 時点に適用される（D05 §7.6。H2 と同じ）。
opportunity_validity:
  bindings: []

components:
  # 日足の局面（版 2 で足した 4 段。H2・検証戦略 B と同じ形）。
  - instance_id: "daily_ema"
    component: "ema"
    component_version: 2
    inputs:
      prices:
        - "market:EURUSD/1d_ny17/bid:CLOSE"
    parameters:
      period: {type: "INT", value: 20}
      window_bars: {type: "INT", value: 60}
    triggers:
      - {name: "d1", when: "bar_close", series: "EURUSD/1d_ny17/bid"}

  - instance_id: "daily_above_ema"
    component: "price_compare"
    component_version: 2
    inputs:
      left:
        - "market:EURUSD/1d_ny17/bid:CLOSE"
      right:
        - "output:daily_ema.value"
    parameters:
      operator: {type: "STR", value: "GT"}
    triggers:
      - {name: "d1", when: "bar_close", series: "EURUSD/1d_ny17/bid"}

  - instance_id: "no_short"
    component: "constant_condition"
    component_version: 1
    parameters:
      value: {type: "BOOL", value: false}
    triggers:
      - {name: "d1", when: "bar_close", series: "EURUSD/1d_ny17/bid"}

  - instance_id: "market_state"
    component: "permission_from_condition"
    component_version: 2
    inputs:
      long_allowed:
        - "output:daily_above_ema.condition"
      short_allowed:
        - "output:no_short.condition"
    triggers:
      - {name: "d1", when: "bar_close", series: "EURUSD/1d_ny17/bid"}

  # ここから下の 7 件（取引機会と出口）は版 1 と同じ。
  - instance_id: "fast_ema"
    component: "ema"
    component_version: 1
    inputs:
      prices:
        - "market:EURUSD/1h/bid:CLOSE"
    parameters:
      period: {type: "INT", value: 20}
      window_bars: {type: "INT", value: 60}
    triggers:
      - {name: "h1", when: "bar_close", series: "EURUSD/1h/bid"}

  - instance_id: "slow_ema"
    component: "ema"
    component_version: 1
    inputs:
      prices:
        - "market:EURUSD/1h/bid:CLOSE"
    parameters:
      period: {type: "INT", value: 50}
      window_bars: {type: "INT", value: 300}
    triggers:
      - {name: "h1", when: "bar_close", series: "EURUSD/1h/bid"}

  - instance_id: "stop_level"
    component: "extreme_price"
    component_version: 1
    inputs:
      prices:
        - "market:EURUSD/1h/bid:LOW"
    parameters:
      lookback: {type: "INT", value: 20}
      mode: {type: "STR", value: "MIN"}
    triggers:
      - {name: "h1", when: "bar_close", series: "EURUSD/1h/bid"}

  # 突破の価格に部品の出力（短い EMA の値）をつなぐ。既存の宣言は市場データの終値だけで、この
  # つなぎ方は既存の宣言に無い（D22 の仮置き 27。型はどちらも `price@v1`）。
  - instance_id: "entry_trigger"
    component: "breakout_trigger"
    component_version: 1
    inputs:
      price:
        - "output:fast_ema.value"
      level:
        - "output:slow_ema.value"
    parameters:
      direction: {type: "STR", value: "LONG"}
    triggers:
      - {name: "h1", when: "bar_close", series: "EURUSD/1h/bid"}

  - instance_id: "entry_order"
    component: "market_order_intent"
    component_version: 1
    inputs:
      opportunity:
        - "output:entry_trigger.opportunity"
    triggers:
      - {name: "opp", when: "input_event", input_name: "opportunity"}

  - instance_id: "initial_stop"
    component: "level_stop_loss"
    component_version: 1
    inputs:
      opportunity:
        - "output:entry_trigger.opportunity"
      level:
        - "output:stop_level.level"
    triggers:
      - {name: "opp", when: "input_event", input_name: "opportunity"}

  - instance_id: "take_profit"
    component: "fixed_rr_take_profit"
    component_version: 1
    inputs:
      position:
        - "runtime:POSITION"
    parameters:
      reward_risk: {type: "FLOAT", value: 1.5}
    triggers:
      - {name: "filled", when: "runtime_event", event: "POSITION_OPENED"}

# どの出力がどの役割を担うか（D04 §3 の名前付きフィールド）。版 2 で市場状態の役割を足した（H2 と同じ）。
roles:
  market_state: "market_state.permission"
  trigger: "entry_trigger.opportunity"
  order: "entry_order.intent"
  protection: "initial_stop.protection"
  exit: "take_profit.action"

# 取引機会を同時にいくつ保持するか（ADR-0032。A・B・H2・H6 と同じ）。
opportunity_concurrency:
  max_active: 1
  on_new_trigger: "KEEP_EXISTING"
  on_order_accepted: "KEEP_OTHERS"
