# 実行器が起動する作業役（発想役・分析役・確かめ役）の上限（D25 §5.1。順 11 の後追いの PR の仮置き H4・H5）
#
# 実行器は起動のたびに origin/main のこのファイルを読む（作業役の定義と同じ時点）。無ければ下と同じ
# 既定の値を使う。形が違えば作業役を起動しない（道具の失敗）。
# 上限に当たった作業役は「作業役の失敗」（WORKER_FAILED）として扱う: 同じ段を 1 回だけやり直し、
# 2 回目で止める（D25 §5.6）。
# 人間が PR の merge で承認する（定型 PR では変えない。D25 §6.2）。

schema_version: 1

# やり取りの回数の上限（claude の --max-turns。1〜500）。
# 根拠: 束のファイルは数十〜百ほどで、1 回のやり取りで複数を読めるので、読む・書くを合わせて 100 回あれば足りる見込み。
max_turns: 100

# 壁時計の時間の上限（分。1〜1440）。超えたら包みが作業役のプロセスだけを自分の PID で止める。
# 根拠: 作業役は同時に 1 つまで（D25 §4.4）なので、ほかの作業役を待たせる長さを 1 時間までに抑える。
timeout_minutes: 60
