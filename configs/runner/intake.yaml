# 実行器の口ごとの取り出しの上限（人間の決定 256、D27 §4.6 と仮置き 20〜23、D25 §3.6・§3.7 の注記）
#
# 人間の口（human）・AI の口（ai）のそれぞれから、何枚まで仮説カードを取り出すか。
# 実行器は 1 歩ごとに origin/main のこのファイルを読む（configs/runner/workers.yaml と同じ扱い）。
# - このファイルが無い・max_cards_per_mouth が無い・口のキーが無い・値が null の口は上限なし（いまの動き）。
# - 形が違えば（知らないキー、1〜100 の外の値、整数でない値）上限なしに倒さず、取り出しと発想役の起動をしない。
# 数えるのは、実行器の状態に取り出されたカードすべて（棄却・途中で終えたカードも数える。D27 の仮置き 21）。
# 上限に達した口からは新しく取り出さない（走っているカードは進む）。AI の口が上限に達している間は
# 発想役を起動しない（D27 の仮置き 22）。
# 人間が PR の merge で承認する（定型 PR では変えない。D25 §6.2）。
#
# 値は通しの確かめ（D27）の値: 人間の口 1 枚・AI の口 1 枚（決定 154・256、D27 の仮置き 23）。
# 入口に届かずに終えたカードをやり直すときは、その口の値を人間が 1 つ上げる（D27 の仮置き 17）。
# 通しの後に値をどうするか（ファイルを消す・値を変える）は、通しの後に人間に問う（D27 の仮置き 23）。

schema_version: 1

max_cards_per_mouth:
  human: 1
  ai: 1
